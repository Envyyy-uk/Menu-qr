<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Menu Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d1a16">
<link rel="manifest" href="admin.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/admin-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Admin">
<style>
/* ==========================================================================
   Адмінка меню. Не частина сайту для гостей: сюди заходить одна людина з
   ключем доступу GitHub, править каталог і зберігає — GitHub далі сам
   перезбирає сторінки.

   Оформлення навмисно простіше за меню: тут працюють, а не милуються.
   ========================================================================== */
:root {
  --paper: #f7f3ea;
  --edge:  #e6dfd1;
  --ink:   #1d1a16;
  --muted: #6d6455;
  --faint: #8d8474;
  --gold:  #a8843f;
  --gold-soft: #cbb083;
  --line:  rgba(168, 132, 63, .3);
  --bad:   #a33a2a;
  --sans:  "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
/* подвійний дотик не збільшує сторінку — в адмінці за нього чіпляються,
   коли цілять у поле */
html, body { touch-action: manipulation; }
body {
  margin: 0;
  background: var(--edge);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: #1d1a16;
  color: var(--paper);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.mark { font-weight: 600; letter-spacing: .2em; color: var(--gold-soft); font-size: 13px;
        white-space: nowrap; }

/* на телефоні шапка тісна: марка, імʼя, три мови й «Вийти» в один рядок */
@media (max-width: 460px) {
  header { padding: 9px 12px; }
  .mark { font-size: 11px; letter-spacing: .1em; }
  #who { max-width: 5.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button.ghost { padding: 6px 9px; font-size: 12px; }
  .head-right { gap: 7px; }
}
main { max-width: 760px; margin: 0 auto; padding: 18px 14px 120px; }
h2 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold);
     margin: 26px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
p.hint { color: var(--muted); margin: 8px 0; }
code { background: rgba(29,26,22,.06); padding: 1px 5px; border-radius: 3px; }

.panel { background: var(--paper); border: 1px solid var(--line); padding: 16px; }
label { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
        color: var(--faint); margin: 10px 0 4px; }
input, textarea, select {
  width: 100%; font: inherit; color: inherit; background: #fff;
  border: 1px solid var(--line); border-radius: 3px; padding: 9px 10px;
}
textarea { resize: vertical; min-height: 46px; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold-soft); outline-offset: 1px; }

button {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 3px;
  border: 1px solid var(--gold); background: var(--gold); color: #fff; padding: 10px 16px;
}
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
header button.ghost { color: var(--paper); border-color: rgba(203, 176, 131, .4); padding: 7px 12px; }
button.danger { background: transparent; color: var(--bad); border-color: rgba(163,58,42,.4); padding: 6px 10px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; }

.item { background: var(--paper); border: 1px solid var(--line); padding: 12px 14px; margin-bottom: 10px; }
.item__top { display: flex; gap: 10px; align-items: flex-start; }
.item__top .grow { flex: 1 1 auto; min-width: 0; }
.price { display: flex; align-items: center; gap: 6px; width: 116px; flex: 0 0 auto; }
.price span { color: var(--faint); }
.price input { width: 100%; text-align: right; }
.item summary { cursor: pointer; color: var(--gold); font-size: 12px; letter-spacing: .1em;
                text-transform: uppercase; margin-top: 10px; }
.item__more { padding-top: 6px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 200px; }
.prices { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.prices .hint { flex: 1 1 100%; margin: 0; font-size: 12px; }
.pricebox { flex: 1 1 120px; }
.pricebox label { margin-top: 0; }
.pricebox__row { display: flex; align-items: center; gap: 6px; }
.pricebox__row span { color: var(--faint); }
.pricebox__row input { text-align: right; }
.field-row { display: flex; gap: 8px; }
.field-row input { flex: 1 1 auto; min-width: 0; }
.field-row button { flex: 0 0 auto; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: rgba(29,26,22,.97); color: var(--paper);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
}
.bar .state { font-size: 13px; color: var(--gold-soft); }
.switch { display: flex; align-items: center; gap: 8px; margin: 0 0 12px;
          font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--muted); }
.switch input { width: auto; }
.badge-soon { font-size: 11px; letter-spacing: .1em; color: var(--gold);
              border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; margin-left: 8px; }
.menu--soon .item { opacity: .55; }
.head-right { display: flex; align-items: center; gap: 10px; }
#who { font-size: 13px; color: var(--gold-soft); }
.langs { display: flex; gap: 3px; }
.langs button {
  background: transparent; border: 1px solid rgba(203,176,131,.35);
  color: rgba(247,243,234,.75); font-size: 10px; font-weight: 600;
  letter-spacing: .1em; padding: 5px 7px; border-radius: 2px;
}
.langs button.is-active { background: var(--gold-soft); border-color: var(--gold-soft); color: #1d1a16; }
.hidden { display: none !important; }
.error { color: var(--bad); }
.ok { color: #2f6d4f; }
</style>
</head>
<body>

<header>
  <span class="mark">MENU · ADMIN</span>
  <span class="head-right">
    <span id="who" class="hidden"></span>
    <nav class="langs" id="langs"></nav>
    <button id="logout" class="ghost hidden" type="button" data-i18n="head.logout">Вийти</button>
  </span>
</header>

<main>

  <!-- ------------------------------------------------------------- вхід -- -->
  <section id="login" class="panel">
    <h2 style="margin-top:0" data-i18n="login.title">Вхід</h2>
    <p class="hint" data-i18n="login.lead"></p>
    <p class="hint" data-i18n="login.how"></p>
    <p class="hint"><code id="repo-name"></code></p>
    <label for="name" data-i18n="login.name">Ваше імʼя</label>
    <input id="name" autocomplete="off" autocorrect="off" list="editors"
           data-i18n-placeholder="login.namePlaceholder">
    <datalist id="editors"></datalist>

    <label for="token" data-i18n="login.token">Ключ доступу</label>
    <div class="field-row">
      <input id="token" type="password" autocomplete="off" spellcheck="false"
             autocapitalize="none" autocorrect="off" placeholder="github_pat_…">
      <button id="peek" class="ghost" type="button" data-i18n="login.peek">Показати</button>
    </div>
    <p class="hint"><label style="text-transform:none;letter-spacing:0;color:var(--muted)">
      <input id="remember" type="checkbox" checked style="width:auto"> <span data-i18n="login.remember"></span>
    </label></p>
    <button id="enter" type="button" data-i18n="login.enter">Увійти</button>
    <p id="login-state" class="hint"></p>
  </section>

  <!-- ---------------------------------------------------------- редактор -- -->
  <section id="editor" class="hidden">
    <p class="hint" id="loaded"></p>

    <div class="panel add">
      <h2 style="margin-top:0" data-i18n="add.title">Додати позицію</h2>
      <label for="add-cat" data-i18n="add.category">Розділ</label>
      <select id="add-cat"></select>
      <label for="add-name" data-i18n="add.name">Назва</label>
      <input id="add-name" autocomplete="off" data-i18n-placeholder="add.namePlaceholder">
      <div id="add-prices"></div>
      <p><button id="add" type="button" disabled data-i18n="add.button">Додати</button></p>
      <p id="add-state" class="hint"></p>
    </div>

    <div id="menus"></div>
  </section>

</main>

<div id="bar" class="bar hidden">
  <span class="state" id="state"></span>
  <span>
    <button id="reload" class="ghost" type="button" style="color:var(--paper)"
            data-i18n="bar.reload">Оновити</button>
    <button id="save" type="button" disabled data-i18n="bar.save">Зберегти</button>
  </span>
</div>

<script>
/* ==========================================================================
   Адмінка правит один файл — data/menu.json — через GitHub API. Сторінки
   меню перезбирає GitHub Actions після кожного збереження, тому тут немає
   ні збірки, ні сервера: лише читання, правки й коміт.
   ========================================================================== */
(function () {
  'use strict';

  var REPO   = { owner: 'Envyyy-uk', name: 'Menu-qr', branch: 'claude/menu-page-no-server-rbtr5h' };
  var PATH   = 'data/menu.json';
  var KEY    = 'podval-admin-token';
  var NAME   = 'podval-admin-name';
  var API    = 'https://api.github.com';

  var token = null, data = null, sha = null, dirty = false, author = '';

  var $ = function (id) { return document.getElementById(id); };

  /* ------------------------------------------------------------ мови --- */
  /* Адмінка теж трьома мовами: нею користуються ті самі люди, що й барною
     стійкою, і половина з них читає меню російською чи англійською. Тут
     переклад можна робити скриптом — без нього адмінка й так не працює. */
  var LANGS = [['uk', 'UA'], ['en', 'EN'], ['ru', 'RU']];
  var LANG_KEY = 'podval-admin-lang';
  var lang = 'uk';

  var I18N = {
    'head.logout':  { uk: 'Вийти', en: 'Sign out', ru: 'Выйти' },

    'login.title':  { uk: 'Вхід', en: 'Sign in', ru: 'Вход' },
    'login.lead': {
      uk: 'Замість пароля — особистий ключ доступу GitHub. Пароль у такій сторінці захистити нічого не може: сторінка відкрита, і його побачить будь-хто. Ключ зберігається лише на цьому пристрої, його можна відкликати будь-коли.',
      en: 'Instead of a password — a personal GitHub access key. A password could protect nothing here: the page is public, and anyone can read it. The key is stored on this device only and can be revoked at any time.',
      ru: 'Вместо пароля — личный ключ доступа GitHub. Пароль на такой странице не защищает ничего: страница открыта, и его увидит любой. Ключ хранится только на этом устройстве, его можно отозвать в любой момент.' },
    'login.how': {
      uk: 'Створити: github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens. Доступ — тільки до репозиторію, право Contents: Read and write.',
      en: 'To create: github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens. Access to this repository only, permission Contents: Read and write.',
      ru: 'Создать: github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens. Доступ — только к репозиторию, право Contents: Read and write.' },
    'login.name':   { uk: 'Ваше імʼя', en: 'Your name', ru: 'Ваше имя' },
    'login.namePlaceholder': { uk: 'Як підписувати правки', en: 'How to sign your edits', ru: 'Как подписывать правки' },
    'login.token':  { uk: 'Ключ доступу', en: 'Access key', ru: 'Ключ доступа' },
    'login.peek':   { uk: 'Показати', en: 'Show', ru: 'Показать' },
    'login.hide':   { uk: 'Сховати', en: 'Hide', ru: 'Скрыть' },
    'login.remember': { uk: 'запамʼятати на цьому пристрої', en: 'remember on this device', ru: 'запомнить на этом устройстве' },
    'login.enter':  { uk: 'Увійти', en: 'Sign in', ru: 'Войти' },
    'login.needName': { uk: 'Вкажіть імʼя — ним підписуються правки', en: 'Enter your name — edits are signed with it', ru: 'Укажите имя — им подписываются правки' },
    'login.needToken': { uk: 'Введіть ключ доступу', en: 'Enter the access key', ru: 'Введите ключ доступа' },
    'login.checking': { uk: 'Перевіряємо…', en: 'Checking…', ru: 'Проверяем…' },
    'login.failed': { uk: 'Не вийшло: ', en: 'Failed: ', ru: 'Не вышло: ' },

    'load.loaded':  { uk: 'Каталог завантажено: {n} позицій.', en: 'Catalogue loaded: {n} items.', ru: 'Каталог загружен: {n} позиций.' },
    'load.last':    { uk: ' Останнє редагування: {by}, {at}.', en: ' Last edited by {by}, {at}.', ru: ' Последнее редактирование: {by}, {at}.' },
    'load.tail':    { uk: ' Правки зберігаються в GitHub, сайт оновиться за хвилину-дві.', en: ' Edits are saved to GitHub; the site updates in a minute or two.', ru: ' Правки сохраняются в GitHub, сайт обновится за минуту-две.' },

    'add.title':    { uk: 'Додати позицію', en: 'Add an item', ru: 'Добавить позицию' },
    'add.category': { uk: 'Розділ', en: 'Section', ru: 'Раздел' },
    'add.pick':     { uk: '— оберіть розділ —', en: '— choose a section —', ru: '— выберите раздел —' },
    'add.name':     { uk: 'Назва', en: 'Name', ru: 'Название' },
    'add.namePlaceholder': { uk: 'Як її побачить гість', en: 'As the guest will see it', ru: 'Как её увидит гость' },
    'add.button':   { uk: 'Додати', en: 'Add', ru: 'Добавить' },
    'add.added':    { uk: 'Додано «{name}» у розділ «{cat}». Не забудьте опис і «Зберегти».',
                      en: 'Added “{name}” to “{cat}”. Do not forget the description and Save.',
                      ru: 'Добавлено «{name}» в раздел «{cat}». Не забудьте описание и «Сохранить».' },
    'add.noCat':    { uk: 'Такого розділу немає в жодному меню', en: 'No menu contains this section', ru: 'Такого раздела нет ни в одном меню' },

    'price.base':   { uk: 'Ціна', en: 'Price', ru: 'Цена' },
    'price.ml50':   { uk: '50 мл', en: '50 ml', ru: '50 мл' },
    'price.bottle': { uk: 'Пляшка', en: 'Bottle', ru: 'Бутылка' },
    'price.premium': { uk: 'Пляшка преміум', en: 'Premium bottle', ru: 'Бутылка премиум' },
    'price.glass':  { uk: 'Келих 175 мл', en: 'Glass 175 ml', ru: 'Бокал 175 мл' },
    'price.none':   { uk: 'немає', en: 'none', ru: 'нет' },
    'price.ladder': { uk: 'Решта обʼємів рахується сама: ', en: 'The other sizes are calculated automatically: ', ru: 'Остальные объёмы считаются сами: ' },

    'item.delete':  { uk: 'Видалити', en: 'Delete', ru: 'Удалить' },
    'item.confirmDelete': { uk: 'Видалити «{name}» з меню?', en: 'Delete “{name}” from the menu?', ru: 'Удалить «{name}» из меню?' },
    'item.desc':    { uk: 'Опис трьома мовами', en: 'Description in three languages', ru: 'Описание на трёх языках' },
    'item.translate': { uk: 'Перекласти на дві інші', en: 'Translate into the other two', ru: 'Перевести на два других' },
    'item.translating': { uk: ' Перекладаємо…', en: ' Translating…', ru: ' Переводим…' },
    'item.translated': { uk: ' Готово — переклад машинний, перегляньте', en: ' Done — machine translation, please review', ru: ' Готово — перевод машинный, просмотрите' },
    'item.translateFail': { uk: ' Перекладач не відповів — впишіть вручну', en: ' The translator did not answer — type it manually', ru: ' Переводчик не ответил — впишите вручную' },
    'item.needText': { uk: ' Спершу впишіть опис однією мовою', en: ' First write the description in one language', ru: ' Сначала впишите описание на одном языке' },
    'item.confirmOverwrite': { uk: 'Замінити наявні переклади машинними?', en: 'Replace the existing translations with machine ones?', ru: 'Заменить имеющиеся переводы машинными?' },

    'menu.soon':    { uk: 'Скоро — меню видно на головній, але не відкривається',
                      en: 'Coming soon — the menu is shown on the home page but does not open',
                      ru: 'Скоро — меню видно на главной, но не открывается' },
    'menu.soonBadge': { uk: 'СКОРО', en: 'SOON', ru: 'СКОРО' },
    'menu.empty':   { uk: 'Поки порожньо', en: 'Empty so far', ru: 'Пока пусто' },

    'bar.noChanges': { uk: 'Змін немає', en: 'No changes', ru: 'Изменений нет' },
    'bar.unsaved':  { uk: 'Є незбережені зміни', en: 'Unsaved changes', ru: 'Есть несохранённые изменения' },
    'bar.saving':   { uk: 'Зберігаємо…', en: 'Saving…', ru: 'Сохраняем…' },
    'bar.saved':    { uk: 'Збережено. Сайт оновиться за хвилину-дві.', en: 'Saved. The site updates in a minute or two.', ru: 'Сохранено. Сайт обновится за минуту-две.' },
    'bar.conflict': { uk: 'Хтось уже змінив меню. Натисніть «Оновити» й повторіть правку.',
                      en: 'Someone has already changed the menu. Tap Refresh and redo your edit.',
                      ru: 'Кто-то уже изменил меню. Нажмите «Обновить» и повторите правку.' },
    'bar.failed':   { uk: 'Не зберіглося: ', en: 'Not saved: ', ru: 'Не сохранилось: ' },
    'bar.reload':   { uk: 'Оновити', en: 'Refresh', ru: 'Обновить' },
    'bar.save':     { uk: 'Зберегти', en: 'Save', ru: 'Сохранить' },
    'bar.confirmReload': { uk: 'Незбережені зміни зникнуть. Оновити?', en: 'Unsaved changes will be lost. Refresh?', ru: 'Несохранённые изменения исчезнут. Обновить?' }

  };

  function t(key, vars) {
    var entry = I18N[key];
    var text = entry ? (entry[lang] || entry.uk) : key;
    if (vars) {
      Object.keys(vars).forEach(function (name) {
        text = text.replace('{' + name + '}', vars[name]);
      });
    }
    return text;
  }

  function applyLang() {
    document.documentElement.lang = lang;
    /* Назву застосунку не перекладаємо: на екрані «Домів» і у вкладці вона
       має бути та сама, хоч якою мовою людина працює. */
    [].slice.call(document.querySelectorAll('[data-i18n]')).forEach(function (node) {
      node.textContent = t(node.getAttribute('data-i18n'));
    });
    [].slice.call(document.querySelectorAll('[data-i18n-placeholder]')).forEach(function (node) {
      node.placeholder = t(node.getAttribute('data-i18n-placeholder'));
    });
    [].slice.call(document.querySelectorAll('#langs button')).forEach(function (button) {
      button.className = button.getAttribute('data-lang') === lang ? 'is-active' : '';
    });
    if (data) render();          // підписи всередині списку теж перемальовуємо
    mark();
  }

  function drawLangs() {
    var box = $('langs');
    box.textContent = '';
    LANGS.forEach(function (pair) {
      var button = el('button', null, pair[1]);
      button.type = 'button';
      button.setAttribute('data-lang', pair[0]);
      button.addEventListener('click', function () {
        lang = pair[0];
        try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
        applyLang();
      });
      box.append(button);
    });
  }

  document.getElementById('repo-name').textContent = REPO.owner + '/' + REPO.name;

  /* --------------------------------------------------- база64 з юнікодом -- */
  function encode(text) {
    var bytes = new TextEncoder().encode(text), bin = '';
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin);
  }
  function decode(b64) {
    var bin = atob(b64.replace(/\s/g, ''));
    var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
    return new TextDecoder().decode(bytes);
  }

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + token
    }, options.headers || {});
    return fetch(API + path, options).then(function (r) {
      return r.json().then(function (body) {
        if (!r.ok) throw new Error(body.message || ('GitHub відповів ' + r.status));
        return body;
      });
    });
  }

  /* ------------------------------------------------------------- вхід --- */
  function enter(quiet) {
    var value = $('token').value.trim();
    var who = $('name').value.trim();
    // Імʼя обовʼязкове: ключі спільні для всіх правок, і без підпису в
    // історії не видно, хто саме що змінив.
    if (!who) { state($('login-state'), t('login.needName'), true); return; }
    if (!value) { state($('login-state'), t('login.needToken'), true); return; }
    author = who;
    token = value;
    state($('login-state'), t('login.checking'));
    load().then(function () {
      if ($('remember').checked) {
        try { localStorage.setItem(KEY, token); localStorage.setItem(NAME, author); } catch (e) {}
      }
      $('who').textContent = author;
      $('who').classList.remove('hidden');
      $('login').classList.add('hidden');
      $('editor').classList.remove('hidden');
      $('bar').classList.remove('hidden');
      $('logout').classList.remove('hidden');
    }).catch(function (err) {
      token = null;
      state($('login-state'), t('login.failed') + err.message, true);
      if (quiet) { try { localStorage.removeItem(KEY); } catch (e) {} }
    });
  }

  function state(node, text, bad) {
    node.textContent = text;
    node.className = 'hint' + (bad ? ' error' : '');
  }

  /* ------------------------------------------------------- завантаження -- */
  function load() {
    return api('/repos/' + REPO.owner + '/' + REPO.name + '/contents/' + PATH
               + '?ref=' + encodeURIComponent(REPO.branch))
      .then(function (file) {
        sha = file.sha;
        data = JSON.parse(decode(file.content));
        dirty = false;
        render();
        var last = data.updated
          ? t('load.last', { by: data.updated.by, at: data.updated.at.replace('T', ' ') })
          : '';
        $('loaded').textContent = t('load.loaded', { n: data.items.length })
          + last + t('load.tail');

        // Імена тих, хто вже правив, підказуємо наступного разу
        var list = $('editors');
        list.textContent = '';
        (data.editors || []).concat(data.updated ? [data.updated.by] : [])
          .filter(function (n, i, all) { return n && all.indexOf(n) === i; })
          .forEach(function (n) { list.append(new Option(n)); });
        mark();
      });
  }

  /* ---------------------------------------------------------- малюємо --- */
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function categoryName(key) {
    var cat = data.categories.filter(function (c) { return c.key === key; })[0];
    return cat ? (cat.names[lang] || cat.names.uk || cat.names.en) : key;
  }

  function menuName(menu) {
    return menu.names[lang] || menu.names.uk || menu.names.en;
  }

  function money(pence) { return (pence / 100).toFixed(2).replace(/\.00$/, ''); }

  function fillCategories() {
    var select = $('add-cat');
    var chosen = select.value;
    select.textContent = '';
    // Порожній перший пункт навмисно: без вибраного розділу кнопка
    // «Додати» не працює, тож позиція не може повиснути поза меню.
    select.append(new Option(t('add.pick'), ''));
    data.menus.forEach(function (menu) {
      var box = document.createElement('optgroup');
      box.label = menuName(menu) + (menu.soon ? ' · ' + t('menu.soonBadge') : '');
      menu.categories.forEach(function (catKey) {
        box.append(new Option(categoryName(catKey), catKey));
      });
      select.append(box);
    });
    select.value = chosen;
    drawAddPrices();
    checkAdd();
  }

  var addValues = {};

  /* Поля цін у формі додавання перемальовуються під обраний розділ: у
     міцного питаємо 50 мл і пляшку, у вина — келих і пляшку, у решти одну
     ціну. Поки розділ не обраний, питати нема чого. */
  function drawAddPrices() {
    var box = $('add-prices');
    box.textContent = '';
    addValues = {};
    var cat = $('add-cat').value;
    if (!cat) return;
    box.append(priceFields(pricingOf(cat), addValues, function () {}));
  }

  function checkAdd() {
    $('add').disabled = !$('add-cat').value || !$('add-name').value.trim();
  }

  function render() {
    fillCategories();
    var box = $('menus');
    box.textContent = '';

    data.menus.forEach(function (menu) {
      var group = el('div', 'menu' + (menu.soon ? ' menu--soon' : ''));

      var head = el('h2', null, menuName(menu));
      if (menu.soon) head.append(el('span', 'badge-soon', t('menu.soonBadge')));
      group.append(head);

      /* «Скоро» — стан меню, а не позицій. Увімкнене: картка на головній
         лишається, але не відкривається, а сторінки меню взагалі не
         збираються, тож прямим посиланням теж не зайти. */
      var toggle = el('label', 'switch');
      var box2 = el('input');
      box2.type = 'checkbox';
      box2.checked = !!menu.soon;
      box2.addEventListener('change', function () {
        if (box2.checked) menu.soon = true; else delete menu.soon;
        touch();
        render();
      });
      toggle.append(box2, el('span', null, t('menu.soon')));
      group.append(toggle);

      menu.categories.forEach(function (catKey) {
        var title = el('p', 'hint');
        title.append(el('b', null, categoryName(catKey)));
        group.append(title);

        var count = 0;
        data.items.forEach(function (item) {
          if (item.category === catKey) { group.append(itemNode(item)); count++; }
        });
        if (!count) group.append(el('p', 'hint', t('menu.empty')));
      });

      box.append(group);
    });
  }

  function itemNode(item) {
    var node = el('div', 'item');

    var top = el('div', 'item__top');
    var grow = el('div', 'grow');
    var name = el('input');
    name.value = item.name;
    name.setAttribute('aria-label', 'Назва');
    name.addEventListener('input', function () { item.name = name.value; touch(); });
    grow.append(name);

    var kill = el('button', 'danger', t('item.delete'));
    kill.type = 'button';
    kill.addEventListener('click', function () {
      if (!confirm(t('item.confirmDelete', { name: item.name }))) return;
      data.items.splice(data.items.indexOf(item), 1);
      touch();
      render();
    });

    top.append(grow, kill);
    node.append(top);

    var shape = pricingOf(item.category);
    var values = readPrices(item, shape);
    node.append(priceFields(shape, values, function () {
      applyPrices(item, shape, values);
      touch();
    }));

    var more = el('details', 'item__more');
    more.append(el('summary', null, t('item.desc')));
    var rows = el('div', 'row');
    var areas = {};
    var source = null;      // мова, якою щойно писали — з неї й перекладаємо

    [['uk', 'Українська'], ['en', 'English'], ['ru', 'Русский']].forEach(function (pair) {
      var wrap = el('div');
      wrap.append(el('label', null, pair[1]));
      var area = el('textarea');
      area.value = (item.desc && item.desc[pair[0]]) || '';
      area.addEventListener('input', function () {
        item.desc = item.desc || {};
        item.desc[pair[0]] = area.value;
        source = pair[0];
        touch();
      });
      areas[pair[0]] = area;
      wrap.append(area);
      rows.append(wrap);
    });
    more.append(rows);

    var line = el('p', 'hint');
    var go = el('button', 'ghost', t('item.translate'));
    go.type = 'button';
    var said = el('span', null, ' ');
    go.addEventListener('click', function () {
      translateItem(item, areas, source, go, said);
    });
    line.append(go, said);
    more.append(line);

    node.append(more);

    return node;
  }

  /* ------------------------------------------------------------ ціни --- */
  /* У розділі може бути три різні види ціни. Одна ціна — страва, коктейль,
     кальян. Міцне — за 50 мл і за пляшку, а обʼєми між ними кратні першій:
     100 мл це дві порції, 300 мл — шість. Вино — келих і пляшка.

     Тому адмінка питає лише опорні числа, а драбинку рахує сама: інакше
     кожну позицію довелося б вбивати сімома цінами вручну й щоразу
     перемножувати в голові. */
  var PRICE_FIELDS = {
    'single':       [{ key: 'base', label: 'price.base' }],
    'spirit':       [{ key: 'base', label: 'price.ml50' },
                     { key: 'bottle', label: 'price.bottle' },
                     { key: 'premium', label: 'price.premium', optional: true }],
    'glass-bottle': [{ key: 'base', label: 'price.glass' },
                     { key: 'bottle', label: 'price.bottle' }]
  };

  var STEPS = [50, 100, 150, 200, 250, 300];
  var NAME_BOTTLE  = { uk: 'Пляшка', en: 'Bottle', ru: 'Бутылка' };
  var NAME_PREMIUM = { uk: 'Пляшка (преміум)', en: 'Bottle (Premium)', ru: 'Бутылка (премиум)' };
  var NAME_GLASS   = { uk: 'Келих 175 мл', en: 'Glass 175 ml', ru: 'Бокал 175 мл' };
  var nameMl = function (n) { return { uk: n + ' мл', en: n + ' ml', ru: n + ' мл' }; };

  function pricingOf(catKey) {
    var cat = data.categories.filter(function (c) { return c.key === catKey; })[0];
    return (cat && cat.pricing) || 'single';
  }

  function textOf(choice) {
    return typeof choice.name === 'string' ? choice.name : (choice.name.en || '');
  }

  function sizeOption(item) {
    return (item.options || []).filter(function (o) { return o.key === 'size'; })[0];
  }

  function readPrices(item, shape) {
    var values = { base: item.price_pence || 0 };
    var size = sizeOption(item);
    var choices = (size && size.choices) || [];
    choices.forEach(function (c) {
      var name = textOf(c);
      if (name === 'Bottle') values.bottle = c.price_pence;
      else if (name === 'Bottle (Premium)') values.premium = c.price_pence;
      else if (name === 'Glass 175 ml') values.base = c.price_pence;
      else if (/^50 ml$/.test(name)) values.base = c.price_pence;
    });
    return values;
  }

  function applyPrices(item, shape, values) {
    item.price_pence = values.base || 0;
    if (shape === 'single') return;

    var choices = [];
    if (shape === 'spirit') {
      STEPS.forEach(function (ml) {
        choices.push({ key: 'ml' + ml, name: nameMl(ml),
                       price_pence: Math.round((values.base || 0) * ml / 50) });
      });
      if (values.bottle) choices.push({ key: 'bottle', name: NAME_BOTTLE, price_pence: values.bottle });
      if (values.premium) choices.push({ key: 'bottle-premium', name: NAME_PREMIUM, price_pence: values.premium });
    } else {
      choices.push({ key: 'glass175', name: NAME_GLASS, price_pence: values.base || 0 });
      if (values.bottle) choices.push({ key: 'bottle', name: NAME_BOTTLE, price_pence: values.bottle });
    }

    var size = sizeOption(item);
    if (size) { size.choices = choices; return; }
    item.options = item.options || [];
    item.options.unshift({ key: 'size', label: 'opt.size', choices: choices });
  }

  function ladderHint(shape, values) {
    if (shape !== 'spirit' || !values.base) return '';
    return t('price.ladder') + STEPS.slice(1).map(function (ml) {
      return ml + ' мл — £' + money(Math.round(values.base * ml / 50));
    }).join(' · ');
  }

  /* Поля цін — стільки, скільки потребує розділ. */
  function priceFields(shape, values, onChange) {
    var box = el('div', 'prices');
    var hint = el('p', 'hint');

    PRICE_FIELDS[shape].forEach(function (field) {
      var wrap = el('div', 'pricebox');
      wrap.append(el('label', null, t(field.label)));
      var row = el('div', 'pricebox__row');
      row.append(el('span', null, '£'));
      var input = el('input');
      input.inputMode = 'decimal';
      input.value = values[field.key] ? money(values[field.key]) : '';
      input.placeholder = field.optional ? t('price.none') : '0';
      input.setAttribute('aria-label', t(field.label));
      input.addEventListener('input', function () {
        var pounds = parseFloat(input.value.replace(',', '.'));
        values[field.key] = isNaN(pounds) ? 0 : Math.round(pounds * 100);
        hint.textContent = ladderHint(shape, values);
        onChange();
      });
      row.append(input);
      wrap.append(row);
      box.append(wrap);
    });

    hint.textContent = ladderHint(shape, values);
    box.append(hint);
    return box;
  }

  /* --------------------------------------------------------- переклад --- */
  /* Машинний переклад через безкоштовні відкриті перекладачі: ключів не
     треба, але й обіцяти сталість не можна — тому два джерела й зрозуміла
     помилка. Перекладаємо тільки опис: назви й бренди лишаються як
     надруковано. */
  function translate(text, from, to) {
    var google = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl='
      + from + '&tl=' + to + '&dt=t&q=' + encodeURIComponent(text);
    return fetch(google)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        return d[0].map(function (part) { return part[0]; }).join('');
      })
      .catch(function () {
        var mem = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text)
          + '&langpair=' + from + '|' + to;
        return fetch(mem)
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d.responseData || !d.responseData.translatedText) throw new Error('порожня відповідь');
            return d.responseData.translatedText;
          });
      });
  }

  function translateItem(item, areas, source, button, said) {
    item.desc = item.desc || {};
    // Якщо ще нічого не набирали в цій картці — беремо ту мову, де є текст
    var from = source && (item.desc[source] || '').trim() ? source : null;
    if (!from) {
      ['uk', 'ru', 'en'].forEach(function (code) {
        if (!from && (item.desc[code] || '').trim()) from = code;
      });
    }
    if (!from) { said.textContent = t('item.needText'); return; }

    var targets = ['uk', 'en', 'ru'].filter(function (code) { return code !== from; });
    var filled = targets.filter(function (code) { return (item.desc[code] || '').trim(); });
    if (filled.length && !confirm(t('item.confirmOverwrite'))) return;

    button.disabled = true;
    said.textContent = t('item.translating');

    Promise.all(targets.map(function (code) {
      return translate(item.desc[from], from, code).then(function (text) {
        item.desc[code] = text;
        areas[code].value = text;
      });
    })).then(function () {
      touch();
      button.disabled = false;
      said.textContent = t('item.translated');
    }).catch(function () {
      button.disabled = false;
      said.textContent = t('item.translateFail');
    });
  }

  /* ------------------------------------------------------ нова позиція --- */
  var TRANSLIT = { 'а':'a','б':'b','в':'v','г':'h','ґ':'g','д':'d','е':'e','є':'ie','ж':'zh',
    'з':'z','и':'y','і':'i','ї':'i','й':'i','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p',
    'р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch',
    'ы':'y','ь':'','э':'e','ю':'iu','я':'ia','ъ':'','ё':'e' };

  function slug(text) {
    var out = '';
    text.toLowerCase().split('').forEach(function (ch) {
      out += TRANSLIT[ch] !== undefined ? TRANSLIT[ch] : ch;
    });
    out = out.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    return out || 'item';
  }

  function uniqueKey(base) {
    var keys = data.items.map(function (i) { return i.key; });
    if (keys.indexOf(base) === -1) return base;
    var n = 2;
    while (keys.indexOf(base + '-' + n) > -1) n++;
    return base + '-' + n;
  }

  function menuOf(catKey) {
    return data.menus.filter(function (m) {
      return m.categories.indexOf(catKey) > -1;
    })[0];
  }

  function addItem() {
    var catKey = $('add-cat').value;
    var name = $('add-name').value.trim();
    if (!catKey || !name) { checkAdd(); return; }
    var menu = menuOf(catKey);
    if (!menu) { state($('add-state'), t('add.noCat'), true); return; }

    var shape = pricingOf(catKey);

    // Застереження 18+ ставимо за меню: у барі алкоголь, у кальянах тютюн,
    // на кухні нічого. Інакше про нього просто забудуть.
    var warn = menu.stem === 'bar' ? ['age-check']
             : menu.stem === 'hookah' ? ['tobacco-age-check'] : [];

    var item = {
      key: uniqueKey(slug(name)),
      name: name,
      category: catKey,
      station: menu.stem === 'kitchen' ? 'kitchen' : 'bar',
      price_pence: 0,
      orderable: true,
      state: 'available',
      desc: { uk: '', en: '', ru: '' },
      ing: [],
      w: warn
    };

    applyPrices(item, shape, addValues);
    // Мікс до міцного — те саме правило для всіх позицій розділу, тож нова
    // отримує його одразу, а не «як згадаємо».
    if (shape === 'spirit') item.add = ['mixer'];

    // Кладемо поруч із рештою розділу, а не в кінець файлу: порядок позицій
    // у меню — це порядок у цьому масиві.
    var last = -1;
    data.items.forEach(function (i, n) { if (i.category === catKey) last = n; });
    data.items.splice(last + 1, 0, item);
    touch();

    $('add-name').value = '';
    render();
    state($('add-state'), t('add.added', { name: name, cat: categoryName(catKey) }));
  }

  /* ------------------------------------------------------- збереження --- */
  function touch() { dirty = true; mark(); }

  function mark() {
    $('save').disabled = !dirty;
    $('state').textContent = dirty ? t('bar.unsaved') : t('bar.noChanges');
    $('state').className = 'state';
  }

  function save() {
    if (!dirty) return;
    $('save').disabled = true;
    $('state').textContent = t('bar.saving');

    data.updated = { by: author, at: new Date().toISOString().slice(0, 16) };
    if (data.editors && data.editors.indexOf(author) === -1) data.editors.push(author);

    var body = JSON.stringify({
      message: 'Меню: правки з адмінки (' + author + ')',
      content: encode(JSON.stringify(data, null, 2) + '\n'),
      sha: sha,
      branch: REPO.branch
    });

    api('/repos/' + REPO.owner + '/' + REPO.name + '/contents/' + PATH,
        { method: 'PUT', body: body })
      .then(function (res) {
        sha = res.content.sha;
        dirty = false;
        mark();
        $('state').textContent = t('bar.saved');
        $('state').className = 'state ok';
      })
      .catch(function (err) {
        $('save').disabled = false;
        $('state').textContent = err.message.indexOf('does not match') > -1
          ? t('bar.conflict')
          : t('bar.failed') + err.message;
        $('state').className = 'state error';
      });
  }

  /* ------------------------------------------------------------ старт --- */
  $('peek').addEventListener('click', function () {
    var box = $('token');
    var shown = box.type === 'text';
    box.type = shown ? 'password' : 'text';
    $('peek').textContent = shown ? t('login.peek') : t('login.hide');
  });
  $('add').addEventListener('click', addItem);
  $('add-cat').addEventListener('change', function () { drawAddPrices(); checkAdd(); });
  $('add-name').addEventListener('input', checkAdd);
  $('enter').addEventListener('click', function () { enter(false); });
  $('token').addEventListener('keydown', function (e) { if (e.key === 'Enter') enter(false); });
  $('save').addEventListener('click', save);
  $('reload').addEventListener('click', function () {
    if (dirty && !confirm(t('bar.confirmReload'))) return;
    load().catch(function (err) { $('state').textContent = err.message; });
  });
  $('logout').addEventListener('click', function () {
    try { localStorage.removeItem(KEY); localStorage.removeItem(NAME); } catch (e) {}
    location.reload();
  });
  window.addEventListener('beforeunload', function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  try {
    var savedLang = localStorage.getItem(LANG_KEY);
    if (savedLang && I18N['bar.save'][savedLang]) lang = savedLang;
  } catch (e) { /* приватний режим */ }

  drawLangs();
  applyLang();

  try {
    var saved = localStorage.getItem(KEY);
    var savedName = localStorage.getItem(NAME);
    if (savedName) $('name').value = savedName;
    if (saved && savedName) { $('token').value = saved; enter(true); }
  } catch (e) { /* приватний режим */ }
}());
</script>
</body>
</html>
