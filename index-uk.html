<style>
/* ==========================================================================
   Сторінка меню. Друкована картка, а не застосунок: папір, золото,
   антиква. Один світлий режим навмисно — меню має виглядати як надруковане.
   ========================================================================== */

:root {
  --paper:      #f7f3ea;
  --paper-edge: #e6dfd1;
  --ink:        #1d1a16;
  --muted:      #6d6455;
  --faint:      #8d8474;
  --gold:       #a8843f;
  --gold-soft:  #cbb083;
  --line:       rgba(168, 132, 63, .28);
  --line-soft:  rgba(29, 26, 22, .12);

  --serif: "Cormorant Garamond", "Didot", "Bodoni MT", "Playfair Display",
           "Times New Roman", Times, Georgia, serif;
  --sans:  "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;

  --wrap: 1080px;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

/* Подвійний дотик більше не збільшує сторінку: у меню за нього чіпляються
   випадково, і текст стрибає масштабом посеред читання. Щипок двома пальцями
   лишається — тим, кому дрібно, він потрібен. */
html, body { touch-action: manipulation; }

body {
  margin: 0;
  background: var(--paper-edge);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  padding-top: calc(var(--bar) + var(--inset));
}

/* Те, чого без скрипта немає сенсу показувати. */
.js-only { display: none; }
.js .js-only { display: block; }

/* ------------------------------------------------------------- шапка --- */
/* Панель прикріплена до верху вікна: марка, мови й розділи стоять на місці,
   а меню проходить під ними. Висота панелі описана змінною — з неї ж
   береться відступ сторінки, щоб перший рядок меню не ховався під панеллю.

   Відступ під системний рядок обмежений навмисно. Без нього годинник і
   заряд лягають просто на панель; з голим env(safe-area-inset-top) деякі
   вбудовані переглядачі повідомляють пів екрана, і над маркою повисає чорна
   смуга. Обмеження лишає рівно висоту системного рядка й не більше. */
:root {
  --bar: 100px;                                  /* марка + стрічка розділів */
  --bar-plain: 50.5px;                           /* на головній стрічки немає */
  --inset: min(env(safe-area-inset-top, 0px), 52px);   /* під системний рядок */
}

.no-chips { --bar: var(--bar-plain); }

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 30;
  padding-top: var(--inset);
  background: #1d1a16;
  box-shadow: 0 8px 20px rgba(29, 26, 22, .18);
}

.site {
  background: #1d1a16;
  color: var(--paper);
}

.site__bar {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.mark {
  display: inline-flex;
  text-decoration: none;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .28em;
  color: var(--gold-soft);
  align-items: baseline;
  gap: 8px;
}

.langs { display: flex; gap: 4px; }

.lang {
  text-decoration: none;
  background: transparent;
  border: 1px solid rgba(203, 176, 131, .35);
  color: rgba(247, 243, 234, .75);
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  padding: 6px 10px;
  border-radius: 2px;
  cursor: pointer;
  user-select: none;
  transition: background .15s, color .15s, border-color .15s;
}

.lang:hover { border-color: var(--gold-soft); color: var(--paper); }

.lang.is-active {
  background: var(--gold-soft);
  border-color: var(--gold-soft);
  color: #1d1a16;
}

/* ------------------------------------------------- стрічка розділів --- */
.subbar {
  border-top: 1px solid rgba(203, 176, 131, .18);
}

.subbar__inner {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 8px 12px;
  display: flex;
}

.chips { display: flex; }

/* -------------------------------------------------------------- аркуш --- */
/* Ціль кнопки «нагору». Запас зверху дорівнює висоті панелі, інакше перехід
   лишав би початок аркуша під нею. */
.sheet {
  scroll-margin-top: calc(var(--bar) + var(--inset));
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 18px 12px 40px;
}

.sheet__inner {
  background: var(--paper);
  border: 1px solid var(--line);
  outline: 1px solid rgba(29, 26, 22, .06);
  outline-offset: 6px;
  padding: 34px 20px 30px;
  box-shadow: 0 18px 50px rgba(29, 26, 22, .10);
}

/* ------------------------------------------------------------ титул --- */
.masthead { text-align: center; }

.masthead__title {
  margin: 0;
  font-weight: 400;
  font-size: clamp(30px, 9vw, 62px);
  line-height: 1.05;
  letter-spacing: .1em;
  text-indent: .1em;
  text-transform: uppercase;
}

.masthead__sub {
  margin: 10px 0 0;
  font-style: italic;
  color: var(--muted);
  font-size: 15px;
}

/* Тонка лінія з ромбом посередині — розділювач із друкованої картки. */
.rule {
  height: 1px;
  background: var(--line);
  margin: 16px auto;
  max-width: 340px;
  position: relative;
}

.rule--diamond::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 6px;
  height: 6px;
  background: var(--gold);
  transform: translate(-50%, -50%) rotate(45deg);
}

/* ---------------------------------------------------------- панель --- */
/* Пошук лишається на аркуші й гортається разом із ним: липким тут має бути
   лише те, чим гість користується постійно, — розділи. */
.toolbar { margin: 24px 0 4px; }

.field { position: relative; }

.field input {
  width: 100%;
  appearance: none;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  padding: 8px 30px 8px 2px;
  font-family: var(--serif);
  font-size: 16px;
  font-style: italic;
  color: var(--ink);
}

.field input::placeholder { color: var(--faint); }

/* власний хрестик уже є — системний лише дублює його */
.field input::-webkit-search-cancel-button { display: none; }

.field input:focus { outline: none; border-bottom-color: var(--gold); }

.field__clear {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  appearance: none;
  background: none;
  border: 0;
  color: var(--faint);
  font-size: 14px;
  cursor: pointer;
  padding: 4px 6px;
}

.chips {
  flex: 1 1 auto;
  min-width: 0;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}

.chips::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto;
  text-decoration: none;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(247, 243, 234, .72);
  border: 1px solid rgba(203, 176, 131, .3);
  border-radius: 999px;
  padding: 7px 13px;
  white-space: nowrap;
  transition: color .15s, border-color .15s, background .15s;
}

.chip:hover { color: var(--paper); border-color: var(--gold-soft); }

/* назад на головну — інша роль, ніж у розділів, тому й вигляд інший */
.chip--back {
  color: var(--gold-soft);
  border-color: transparent;
  padding-left: 4px;
}

.chip--back:hover { color: var(--paper); border-color: transparent; }

.chip--top {
  font-size: 14px;
  line-height: 1;
  padding: 6px 11px;
}

.chip.is-active {
  color: #1d1a16;
  border-color: var(--gold-soft);
  background: var(--gold-soft);
}

.toolbar__count {
  margin: 6px 0 0;
  font-size: 12px;
  font-style: italic;
  color: var(--faint);
}

/* -------------------------------------------------------- головна --- */
/* Розділів десять, і гортати їх згори вниз довго. Тому першим екраном —
   вибір розділу картками. Це звичайні посилання: працюють без скрипта. */
.home { margin: 26px 0 34px; }

.home__pick {
  margin: 0 0 14px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .26em;
  text-indent: .26em;
  text-transform: uppercase;
  color: var(--gold);
  text-align: center;
}

.cards {
  display: grid;
  gap: 10px;
}

.card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 15px 44px 15px 18px;
  position: relative;
  text-decoration: none;
  color: inherit;
  border: 1px solid var(--line);
  background: linear-gradient(100deg, rgba(168, 132, 63, .05), rgba(168, 132, 63, .01));
  transition: border-color .15s, background .15s;
}

/* ромб замість стрілки — той самий знак, що й у розділювачах картки */
.card::after {
  content: "";
  position: absolute;
  right: 18px;
  top: 50%;
  width: 7px;
  height: 7px;
  background: var(--gold-soft);
  transform: translateY(-50%) rotate(45deg);
  transition: background .15s;
}

.card:hover {
  border-color: var(--gold-soft);
  background: rgba(168, 132, 63, .09);
}

/* меню, яке ще не відкрите: видно, але не веде нікуди */
.card--soon {
  cursor: default;
  background: none;
  border-style: dashed;
}

.card--soon .card__name { color: var(--muted); }
.card--soon .card__icon { color: var(--line); }
.card--soon .card__meta { color: var(--gold); }
.card--soon::after { display: none; }
.card--soon:hover { border-color: var(--line); background: none; }

.card:hover::after { background: var(--gold); }

.card__icon {
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  color: var(--gold-soft);
  transition: color .15s;
}

.card__icon svg { width: 100%; height: 100%; display: block; }

.card:hover .card__icon { color: var(--gold); }

.card__text {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.card__name {
  font-size: 21px;
  font-weight: 700;
  line-height: 1.2;
}

.card__meta {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--faint);
}

/* ---------------------------------------------------------- розділи --- */
.menu { margin-top: 18px; }

.section {
  break-inside: avoid;
  margin: 0 0 34px;
  scroll-margin-top: calc(var(--bar) + var(--inset) + 12px);
}

.section__head { margin-bottom: 12px; }

.section__title {
  margin: 0 0 6px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .26em;
  text-indent: .26em;
  text-transform: uppercase;
  color: var(--gold);
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
}

.note {
  margin: 0 0 16px;
  border: 1px solid var(--line);
  padding: 10px 14px;
  font-style: italic;
  font-size: 14px;
  color: var(--muted);
  background: rgba(168, 132, 63, .045);
}

/* ---------------------------------------------------------- позиція --- */
.item {
  padding: 12px 0;
  border-bottom: 1px solid var(--line-soft);
}

.item:last-child { border-bottom: 0; }

.item__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
}

.item__name {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: .01em;
}

.item__price {
  margin: 0;
  flex: 0 0 auto;
  font-size: 18px;
  color: var(--gold);
  white-space: nowrap;
}

.item__from {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--faint);
}

.badge {
  font-family: var(--sans);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  vertical-align: middle;
  color: var(--gold);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 1px 4px;
}

.item__desc {
  margin: 4px 0 0;
  font-style: italic;
  font-size: 15px;
  color: var(--muted);
}

.item__taste {
  color: var(--faint);
  font-size: .94em;
}

.item__opt {
  margin: 6px 0 0;
  font-size: 14px;
  color: var(--ink);
}

.item__optLabel .item__add {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: .1em;
  border-bottom: 0;
}

.item__optLabel {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--faint);
  margin-right: 8px;
}

.choice { white-space: nowrap; }
.choice__price { color: var(--gold); }

/* доплата зверху до ціни позиції — має читатися як ціна, а не як варіант */
.item__add {
  color: var(--gold);
  border-bottom: 1px solid var(--line);
}
.sep { color: var(--gold-soft); }

.more { display: inline; }

.more__summary {
  display: inline;
  list-style: none;
  cursor: pointer;
  margin-left: 8px;
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gold);
  border-bottom: 1px dotted var(--gold-soft);
}

.more__summary::-webkit-details-marker { display: none; }
.more[open] .more__summary { color: var(--faint); border-bottom-color: transparent; }

.more__list {
  margin: 5px 0 0;
  padding-left: 12px;
  border-left: 1px solid var(--line);
  font-size: 13px;
  color: var(--muted);
}

.item__ing {
  margin: 6px 0 0;
  font-size: 13px;
  color: var(--faint);
}

.item__ingLabel {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.empty {
  margin: 30px 0;
  text-align: center;
  font-style: italic;
  color: var(--muted);
}

/* ------------------------------------------------------------- підвал --- */
.foot {
  margin-top: 26px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}

.foot p { margin: 6px 0 0; }
.foot__fine { color: var(--faint); font-style: italic; }

/* ----------------------------------------------------------- нагору --- */
/* Барне меню довге: щоб повернутися до розділів угорі, гостю довелося б довго
   гортати. Кнопка зʼявляється, коли до верху вже далеко, і стоїть у нижньому
   кутку — під великим пальцем, але збоку від назв і цін. */
.totop {
  position: fixed;
  right: 14px;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 5;
  width: 46px;
  height: 46px;
  border: 1px solid var(--gold);
  border-radius: 50%;
  background: rgba(29, 26, 22, .92);
  color: var(--gold-soft);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(29, 26, 22, .25);
  opacity: 0;
  visibility: hidden;
  transition: opacity .18s ease, visibility .18s ease;
}

.totop.is-on { opacity: 1; visibility: visible; }

@media (prefers-reduced-motion: reduce) {
  .totop { transition: none; }
}

/* ------------------------------------------------------- широкий екран --- */
@media (min-width: 560px) {
  .cards { grid-template-columns: 1fr 1fr; }
}

@media (min-width: 860px) {
  .sheet { padding: 26px 24px 60px; }
  .sheet__inner { padding: 46px 44px 38px; }
  :root { --bar: 102px; }
  .toolbar { margin: 28px 0 6px; }
  .subbar__inner { padding: 9px 24px; }

  .menu {
    columns: 2;
    column-gap: 48px;
  }

  .home { margin: 30px 0 40px; }

  .section { margin-bottom: 30px; }
}

@media (min-width: 1200px) {
  body { font-size: 18px; }
}

/* --------------------------------------------------------------- друк --- */
@media print {
  .topbar, .toolbar, .totop { display: none !important; }
  body { background: #fff; }
  .sheet__inner { box-shadow: none; border-color: #bbb; }
  .menu { columns: 2; column-gap: 34px; }
}

</style>

    <p>Алкоголь і тютюн — лише повнолітнім. Бармен може попросити документ.</p>
    <p class="foot__fine">Ціни у фунтах стерлінгів. Меню довідкове — замовлення приймає офіціант.</p>
  </footer>
  </div>
  </div>
</main>

<script>
/* ==========================================================================
   Покращення, а не основа. Меню вже в HTML і читається без цього файлу:
   мова — окремі сторінки, розділи — звичайні якорі, обʼєми — <details>.
   Скрипт додає пошук, підсвітку розділу, памʼять про мову й перехід між
   мовами без втрати місця читання.
   ========================================================================== */
(function () {
  'use strict';

  var LANGS = ['ru', 'en', 'uk'];
  var STORAGE_KEY = 'menu-lang';
  var LANG = document.body.getAttribute('data-lang');
  var STEM = document.body.getAttribute('data-stem');

  document.documentElement.className += ' js';

  function barHeight() {
    var bar = document.querySelector('.topbar');
    return bar ? bar.getBoundingClientRect().height : 100;
  }

  /* ------------------------------------------------------------- мова --- */
  /* Сторінка кожної мови окрема, тож перемикач — звичайні посилання. Скрипту
     лишається памʼять: запамʼятати вибір і на наступному заході відкрити ту
     саму мову. Мову браузера навмисно не питаємо — основна мова меню
     російська, і сторінка має відкриватися нею, поки гість не перемкнув. */
  function stored() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      return LANGS.indexOf(saved) > -1 ? saved : null;
    } catch (err) { return null; }
  }

  function remember(code) {
    try { localStorage.setItem(STORAGE_KEY, code); } catch (err) { /* ігноруємо */ }
  }

  /* Пошуковий запит їде разом із мовою: слово в адресі, а не в памʼяті, бо
     сторінка іншої мови — окремий файл і починає з чистого аркуша. */
  function param(name) {
    var hit = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    if (!hit) return '';
    try { return decodeURIComponent(hit[1].replace(/\+/g, ' ')); } catch (err) { return ''; }
  }

  var asked = param('q');

  function langHref(link) {
    var base = link.getAttribute('href').split('#')[0].split('?')[0];
    /* Поки в пошуку щось написано, гість читає не розділ, а знахідки: якір
       розділу відніс би його казна-куди, тож несемо сам запит і лишаємо
       гостя вгорі результатів. */
    var input = document.querySelector('.field input');
    var typed = input ? input.value.trim() : '';
    if (typed) return base + '?q=' + encodeURIComponent(typed);
    var here = currentSection();
    return here ? base + '#cat-' + here : base;
  }

  var links = [].slice.call(document.querySelectorAll('.lang[data-lang]'));

  links.forEach(function (link) {
    link.addEventListener('click', function () {
      remember(link.getAttribute('data-lang'));
      link.href = langHref(link);
    });
  });

  var want = (location.search.match(/[?&]lang=([a-z]{2})/) || [])[1];
  if (LANGS.indexOf(want) === -1) want = stored();

  if (want && want !== LANG) {
    var twin = links.filter(function (l) { return l.getAttribute('data-lang') === want; })[0];
    if (twin) {
      remember(want);
      var to = twin.getAttribute('href').split('#')[0].split('?')[0];
      if (asked) to += '?q=' + encodeURIComponent(asked);
      location.replace(to + location.hash);
      return;
    }
  }
  if (want === LANG) remember(LANG);

  /* ------------------------------------------------------------ пошук --- */
  function fold(text) {
    return (text || '').toLowerCase().replace(/ё/g, 'е').replace(/['’`]/g, 'ʼ').trim();
  }

  /* «1 позиція», «2 позиції», «5 позицій» — форми числа беремо зі сторінки,
     щоб мови жили в даних, а не в скрипті. */
  function countText(n, box) {
    var forms = (box.getAttribute('data-forms') || '').split('|');
    if (forms.length < 3) return n + ' ' + forms[0];
    if (box.getAttribute('data-lang') === 'en') return n + ' ' + (n === 1 ? forms[0] : forms[1]);
    var tens = n % 100, unit = n % 10;
    if (unit === 1 && tens !== 11) return n + ' ' + forms[0];
    if (unit >= 2 && unit <= 4 && (tens < 12 || tens > 14)) return n + ' ' + forms[1];
    return n + ' ' + forms[2];
  }

  var sections = [].slice.call(document.querySelectorAll('.section'));
  var chips = [].slice.call(document.querySelectorAll('.chip[data-cat]'));

  function wireSearch() {
    var input = document.querySelector('.field input');
    var clear = document.querySelector('.field__clear');
    var count = document.querySelector('.toolbar__count');
    var empty = document.querySelector('.empty');
    var items = [].slice.call(document.querySelectorAll('.item'));
    if (!input) return;

    function filter() {
      var query = fold(input.value);
      var shown = 0;

      items.forEach(function (item) {
        var hit = !query || item.getAttribute('data-search').indexOf(query) > -1;
        item.hidden = !hit;
        if (hit) shown++;
      });

      sections.forEach(function (section) {
        section.hidden = !section.querySelector('.item:not([hidden])');
        /* Спільна примітка розділу стосується всього розділу, а не знахідки —
           під час пошуку вона тільки заважає читати результат. */
        var note = section.querySelector('.note');
        if (note) note.hidden = !!query;
      });

      chips.forEach(function (chip) {
        var section = document.getElementById('cat-' + chip.getAttribute('data-cat'));
        chip.hidden = !section || section.hidden;
      });

      if (count) count.textContent = countText(shown, count);
      if (empty) empty.hidden = shown > 0;
      if (clear) clear.hidden = !input.value;
    }

    if (asked) input.value = asked;

    input.addEventListener('input', filter);
    clear.addEventListener('click', function () {
      input.value = '';
      filter();
      input.focus();
    });
    filter();
  }

  /* -------------------------------------------- підсвітка розділу --- */
  var active = '';

  /* Розділ, який гість зараз читає. Запас у 60 px — це висота заголовка:
     одразу після переходу до розділу його заголовок стоїть трохи нижче
     панелі, і без запасу поточним вважався б попередній розділ. */
  function currentSection() {
    var edge = barHeight() + 60;
    var found = '';
    sections.forEach(function (section) {
      /* Схований пошуком розділ не має розмірів, і його верх — нуль: без цієї
         перевірки поточним вважався б останній схований, тобто самий низ меню. */
      if (section.hidden || !section.offsetParent) return;
      if (section.getBoundingClientRect().top <= edge) {
        found = section.id.replace('cat-', '');
      }
    });
    return found || active;
  }

  function wireSpy() {
    if (!sections.length || !chips.length || !window.IntersectionObserver) return;

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        active = entry.target.id.replace('cat-', '');
        chips.forEach(function (chip) {
          var on = chip.getAttribute('data-cat') === active;
          chip.classList.toggle('is-active', on);
          if (on) chip.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });

    sections.forEach(function (section) { observer.observe(section); });
  }

  /* ----------------------------------------------------------- нагору --- */
  function wireTop() {
    var button = document.querySelector('.totop');
    if (!button) return;

    /* Півтора екрана — стільки, щоб кнопка не мигтіла на перших рядках, але
       вже стояла напоготові, коли гість справді пішов углиб меню. */
    var deep = false;

    function look() {
      var now = window.pageYOffset > window.innerHeight * 1.5;
      if (now === deep) return;
      deep = now;
      button.classList.toggle('is-on', deep);
    }

    /* Фокус на пошук навмисно не ставимо: на телефоні це підняло б
       клавіатуру, а гість просто хотів повернутися до початку. */
    button.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    window.addEventListener('scroll', look, { passive: true });
    look();
  }

  wireSearch();
  wireSpy();
  wireTop();

  /* ------------------------------------------------- свіжість меню --- */
  /* Сторінка, додана на екран «Домів», живе в кеші телефона: оновити її
     нічим — адресного рядка немає. Тому вона сама звіряє свій відбиток із
     version.json і, якщо меню змінилося, перезавантажується з новою адресою:
     інакше з кешу приїхала б та сама стара сторінка. */
  function checkFresh() {
    var meta = document.querySelector('meta[name="build"]');
    if (!meta || document.hidden) return;

    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (fresh) {
        if (!fresh.build || fresh.build === meta.content) return;

        /* Якщо ми вже прийшли по цю саме версію, а сторінка все одно стара —
           значить, публікація ще в дорозі. Перезавантажувати вдруге не можна:
           вийде безкінечне коло. */
        var url = new URL(location.href);
        if (url.searchParams.get('v') === fresh.build) return;

        url.searchParams.set('v', fresh.build);
        location.replace(url.toString());
      })
      .catch(function () { /* немає звʼязку — показуємо що є */ });
  }

  checkFresh();
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) checkFresh();
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) checkFresh(); });
}());

</script>
</body>
</html>
